[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alvaro Siqueira Galvao", email = "alvarosiqueira@alu.ufc.br" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3==1.43.98",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]
experiment = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scipy==1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
