campaign_id: "tcc-2026-10"
random_seed: 42
region: "us-east-1"
runtime: "python3.14"
warmup_seconds: 120
measurement_seconds: 120
total_duration_seconds: 240
repetitions_per_condition: 10
blocks: 10

# Twelve pilot runs selected before the campaign. Each composition/architecture
# pair covers all three load patterns and both memory extremes (plus a midpoint).
pilot:
  runs: 12
  conditions:
    - {composition: monolithic, architecture: x86_64, memory_mb: 128, load_pattern: burst}
    - {composition: monolithic, architecture: x86_64, memory_mb: 2048, load_pattern: sparse_miniburst}
    - {composition: monolithic, architecture: x86_64, memory_mb: 512, load_pattern: constant}
    - {composition: monolithic, architecture: arm64, memory_mb: 128, load_pattern: burst}
    - {composition: monolithic, architecture: arm64, memory_mb: 2048, load_pattern: sparse_miniburst}
    - {composition: monolithic, architecture: arm64, memory_mb: 512, load_pattern: constant}
    - {composition: decomposed, architecture: x86_64, memory_mb: 128, load_pattern: burst}
    - {composition: decomposed, architecture: x86_64, memory_mb: 2048, load_pattern: sparse_miniburst}
    - {composition: decomposed, architecture: x86_64, memory_mb: 512, load_pattern: constant}
    - {composition: decomposed, architecture: arm64, memory_mb: 128, load_pattern: burst}
    - {composition: decomposed, architecture: arm64, memory_mb: 2048, load_pattern: sparse_miniburst}
    - {composition: decomposed, architecture: arm64, memory_mb: 512, load_pattern: constant}

latency_constraint:
  primary_lmax_ms: 500
  sensitivity_lmax_ms: [300, 800]
  primary_metric: "p95_e2e"
  conservative_feasibility_rule: "upper_95ci_p95 <= primary_lmax_ms"

factors:
  composition: ["monolithic", "decomposed"]
  architecture: ["x86_64", "arm64"]
  memory_mb: [128, 256, 512, 1024, 2048]
  load_pattern: ["constant", "burst", "sparse_miniburst"]

load_patterns:
  constant:
    model: "constant-arrival-rate"
    rate_per_second: 20
    expected_requests_total: 4800
    expected_requests_measurement: 2400
  burst:
    model: "scheduled-arrival-windows"
    cycle_period_seconds: 5
    active_duration_seconds: 1
    active_rate_per_second: 100
    idle_duration_seconds: 4
    total_cycles: 48
    expected_requests_total: 4800
    expected_requests_measurement: 2400
    expected_requests_per_cycle: 100
  sparse_miniburst:
    model: "scheduled-arrival-windows"
    cycle_period_seconds: 10
    active_duration_seconds: 1
    requests_per_active_window: 5
    offsets_within_window_ms: [0, 200, 400, 600, 800]
    idle_duration_seconds: 9
    total_cycles: 24
    expected_requests_total: 120
    expected_requests_measurement: 60

arrival_schedule:
  constant_tolerance_fraction: 0.05
  burst_per_window_tolerance_fraction: 0.05
  # Also used as the jitter allowance at the burst active-window boundary.
  sparse_timing_jitter_ms: 50
  # Exact five requests per active window; any deviation is an apparatus failure.
  sparse_count_tolerance_fraction: 0.0
  maximum_dropped_iterations: 0

validity:
  no_concurrent_runs: true
  require_alias_target_verified: true
  require_all_raw_data: true
  require_configuration_match: true
  require_generator_capacity: true
